<title id="t">J · Under Amber V2X control the EV discharges ~6.9 kW into the home battery</title><desc id="d">EV pile, home battery and grid power. While the remote EMS switch is off (Amber V2X in control) the EV discharges at its low-SoC limit and the home battery charges from it.</desc>

